[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "utilikit"
version = "0.1.0"
description = "A self-hostable HTTP toolbox API - WHOIS, DNS, screenshots, PDF, image ops, codecs, QR and ~40 more endpoints. Runs on a Raspberry Pi or an old PC."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Görkem Güler" }]
keywords = ["api", "toolbox", "whois", "dns", "screenshot", "self-hosted", "raspberry-pi", "utilities"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Utilities",
]

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "dnspython>=2.6",
    "pillow>=10.3",
    "qrcode>=7.4",
    "python-barcode>=0.15",
    "pyyaml>=6.0",
    "mistune>=3.0",
    "jsonpath-ng>=1.6",
    "python-dateutil>=2.9",
    "tzdata>=2024.1",
    "croniter>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "cryptography>=42.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]          # /v1/screenshot, /v1/pdf, /v1/render
decode = ["pyzbar>=0.1.9"]              # /v1/qr/decode, /v1/barcode/decode  (needs libzbar0)
geo = ["geoip2>=4.8"]                   # offline IP geolocation (bring your own .mmdb)
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/gorkemguler/utilikit"
Documentation = "https://github.com/gorkemguler/utilikit/tree/main/docs"
Issues = "https://github.com/gorkemguler/utilikit/issues"

[project.scripts]
utilikit = "utilikit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/utilikit"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = [
    "B008",              # FastAPI Depends()/Query() in defaults
    "RUF001", "RUF002", "RUF003",  # the Turkish UI strings in i18n.py trip the ambiguous-char check
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
