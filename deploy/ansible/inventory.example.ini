# Copy to inventory.ini. SSH key auth + passwordless sudo assumed.

[utilikit]
tools-box ansible_host=192.168.1.4 ansible_user=pi

[utilikit:vars]
# Generate: python -c "import secrets;print(secrets.token_urlsafe(24))"
utilikit_api_keys=CHANGE_ME
utilikit_allow_private_fetch=false
utilikit_rate_limit_per_min=120
# Set true to install Chromium and enable screenshot/pdf/render.
utilikit_with_browser=true
# Optional absolute base URL for shortener / request-bin links.
utilikit_public_base_url=

utilikit_repo_url=https://github.com/gorkemguler/utilikit.git
utilikit_ref=main
